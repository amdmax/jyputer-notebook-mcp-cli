[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jl"
version = "0.1.0"
description = "Minimal Jupyter Lab CLI for AI-driven remote execution"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "websockets>=13.0",
]

[project.scripts]
jl = "jl.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jl"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
